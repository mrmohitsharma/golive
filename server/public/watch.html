<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e10">
<title>Go Live</title>
<style>
  :root { --bg:#0b0e10; --panel:#15191c; --panel2:#1b2024; --line:#252b30; --ink:#f3f5f4; --muted:#9aa5a0; --live:#e53935; --green:#2e9d5f; --gold:#e0b532; --under:#ff6b6b; --stage-b:40vh; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { background:var(--bg); }
  body { margin:0; color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  a { color:inherit; }
  button { font:inherit; }
  .wrap { max-width:1240px; margin:0 auto; padding:16px; }
  header.top { display:flex; align-items:center; gap:12px; margin-bottom:12px; min-width:0; }
  /* V8: TV-channel bar. The event's logo (or Go Live's) on the left, LIVE bug and clock on the right. */
  @font-face { font-family:'Barlow Condensed'; font-weight:700 800; font-display:swap; src:url(/site/barlow-condensed-800.woff2) format('woff2'); }
  header.top.tv { background:linear-gradient(90deg, var(--panel2), var(--panel) 60%, var(--bg)); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:12px; padding:8px 14px; }
  .logo { flex:none; height:44px; max-width:150px; display:flex; align-items:center; }
  .logo img { max-height:44px; max-width:150px; object-fit:contain; display:block; }
  .logo .gl { display:flex; align-items:center; gap:7px; font-weight:800; font-size:15px; letter-spacing:.08em; color:var(--ink); }
  .logo .gl svg { width:30px; height:30px; }
  .clock { flex:none; font-variant-numeric:tabular-nums; font-weight:800; font-size:14px; color:var(--ink); background:rgba(0,0,0,.35); border-radius:6px; padding:4px 8px; letter-spacing:.04em; }
  .theme-label { color:var(--muted); }
  body.f-sport h1, body.f-sport .tabs button, body.f-sport .pill, body.f-sport .sheet h3, body.f-sport .me-card .big { font-family:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; letter-spacing:.02em; }
  body.f-sport h1 { font-size:26px; text-transform:uppercase; }
  body.f-elegant h1, body.f-elegant .sheet h3 { font-family:'Playfair Display', Georgia, 'Times New Roman', serif; font-weight:700; letter-spacing:.01em; }
  body.f-festive h1, body.f-festive .sheet h3 { font-family:'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; font-weight:800; }
  .brand { font-weight:800; letter-spacing:.06em; font-size:11px; color:var(--gold); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  h1 { font-size:21px; margin:1px 0 0; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub { color:var(--muted); font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:6px; font-size:12px; font-weight:800; letter-spacing:.05em; flex:none; }
  .pill.live { background:var(--live); }
  .pill.live::before { content:""; width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1.2s infinite; }
  .pill.off { background:#3a4247; color:#cfd6d2; }
  @keyframes blink { 50% { opacity:.25; } }

  /* Layout: video + bar on the left, tabs on the right (desktop). Phones and tablets: the video
     stays at the top and plays, the tabs fill the rest of the screen and scroll inside. */
  .grid { display:grid; grid-template-columns:minmax(0,2fr) minmax(300px,1fr); gap:16px; align-items:stretch; }
  .stage { position:relative; }
  .player { position:relative; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .player iframe, .player #yt-player { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .placeholder { position:absolute; inset:0; display:grid; grid-template-columns:minmax(0,1fr); place-items:center; text-align:center; padding:24px; background:radial-gradient(circle at 30% 20%,#1d4a33,#0b0e10 70%); color:#dfe7e2; }
  .placeholder > div { width:100%; max-width:380px; justify-self:center; }
  .player.waiting { aspect-ratio:auto; min-height:max(260px, 56.25vw); }
  @media (min-width:861px) { .player.waiting { aspect-ratio:16/9; min-height:0; } }
  .floats { position:absolute; right:6px; bottom:6px; width:64px; height:75%; pointer-events:none; overflow:visible; z-index:3; }
  .floats span { position:absolute; bottom:0; left:50%; font-size:28px; will-change:transform,opacity; animation:floatUp 2.4s ease-out forwards; }
  @keyframes floatUp {
    0% { transform:translate(-50%,0) scale(.6); opacity:0; }
    12% { opacity:1; transform:translate(calc(-50% + var(--dx1)),-12%) scale(1.1); }
    60% { transform:translate(calc(-50% + var(--dx2)),-260%) scale(1); opacity:.95; }
    100% { transform:translate(calc(-50% + var(--dx1)),-520%) scale(.9); opacity:0; }
  }

  .bar { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .rx { width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--panel); font-size:20px; cursor:pointer; display:grid; place-items:center; transition:transform .12s; touch-action:manipulation; }
  .rx:active, .rx.pop { transform:scale(1.25); }
  .pts { display:inline-flex; align-items:center; gap:6px; height:42px; padding:0 14px; border-radius:999px; border:1px solid rgba(224,181,50,.5); background:rgba(224,181,50,.1); color:var(--gold); font-weight:800; cursor:pointer; }
  .pts.bump { animation:bump .6s ease-out; }
  @keyframes bump { 30% { transform:scale(1.18); background:rgba(224,181,50,.3); } }
  .bar .sp { flex:1; }
  .btn { display:inline-flex; align-items:center; height:38px; padding:0 12px; border-radius:9px; background:var(--panel); border:1px solid var(--line); text-decoration:none; font-size:14px; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .gamepill { height:38px; padding:0 14px; border-radius:999px; border:0; background:var(--gold); color:#141414; font-weight:800; cursor:pointer; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(224,181,50,.18); } }
  .chip-draw { height:38px; background:none; border:1px dashed var(--gold); color:var(--gold); border-radius:999px; padding:0 12px; font-size:13px; font-weight:700; cursor:pointer; }

  .side-wrap { position:relative; min-width:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .side { display:flex; flex-direction:column; overflow:hidden; }
  .tabs { display:flex; border-bottom:1px solid var(--line); flex:none; }
  .tabs button { flex:1; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:12px 4px 9px; cursor:pointer; white-space:nowrap; }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--gold); }
  .tabs .count { display:inline-block; min-width:18px; padding:0 5px; margin-left:5px; border-radius:9px; background:var(--live); color:#fff; font-size:11px; line-height:18px; letter-spacing:0; }
  .side > .body { flex:1; min-height:0; display:flex; flex-direction:column; }
  .board, .chat, .clipsTab, .fans { display:flex; flex-direction:column; flex:1; min-height:0; }
  .chat { height:460px; }
  .scroll { flex:1; min-height:0; overflow:auto; max-height:520px; }
  @media (min-width:861px) {
    .side { height:0; min-height:100%; }
    .side .board, .side .chat, .side .fans, .side .clipsTab { min-height:380px; height:auto; }
    .side .scroll { max-height:none; }
  }

  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px 0; }
  .chip { padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--ink); font-size:13px; cursor:pointer; }
  .chip.on { background:var(--green); border-color:var(--green); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:8px 14px; text-align:left; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-size:12px; font-weight:600; position:sticky; top:0; background:var(--panel); }
  td.num, th.num { text-align:right; }
  .under { color:var(--under); font-weight:700; }
  .club { color:var(--muted); font-size:12px; display:block; }
  .clips { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; padding:14px; }
  .clip { text-decoration:none; }
  .clip img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; background:#000; display:block; }
  .clip span { display:block; font-size:14px; margin-top:6px; }
  .clip small { color:var(--muted); }
  .list a { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--line); text-decoration:none; }
  .empty { padding:16px 14px; color:var(--muted); }
  footer { color:var(--muted); font-size:12px; margin-top:20px; }

  /* Chat */
  .chat .list { flex:1; min-height:0; overflow-y:auto; padding:8px 0; overscroll-behavior:contain; }
  .msg { display:flex; gap:9px; padding:6px 14px; align-items:flex-start; }
  .msg .src { flex:none; width:20px; height:20px; border-radius:5px; display:grid; place-items:center; margin-top:1px; }
  .msg .src svg { width:13px; height:13px; fill:#fff; }
  .src.youtube { background:#ff0033; } .src.facebook { background:#1877f2; } .src.watch { background:var(--green); }
  .msg .who { font-weight:700; font-size:13px; color:#cfe6d8; margin-right:6px; }
  .msg .txt { font-size:14px; overflow-wrap:anywhere; }
  .msg.q .txt { color:#fff; }
  .msg.mine .who { color:var(--gold); }
  .pinned { margin:10px 12px 2px; padding:9px 12px; border:1px solid var(--gold); border-radius:8px; background:rgba(224,181,50,.08); font-size:14px; }
  .pinned .k { color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:2px; }
  .composer { border-top:1px solid var(--line); padding:10px 12px; display:flex; gap:8px; flex:none; }
  .composer input { flex:1; min-width:0; background:#0f1315; border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:10px 11px; font:inherit; font-size:16px; }
  .composer button { background:var(--green); border:0; color:#fff; border-radius:8px; padding:0 14px; font-weight:700; cursor:pointer; }
  .composer button:disabled { opacity:.5; cursor:default; }
  .chat .note { padding:0 12px 10px; font-size:12px; color:var(--muted); min-height:16px; flex:none; }
  .chat .note.err { color:var(--under); }
  .chat .new { align-self:center; margin:-40px 0 8px; position:relative; background:var(--gold); color:#111; border:0; border-radius:999px; padding:4px 12px; font-size:12px; font-weight:700; cursor:pointer; }

  /* Games tab: my points and Top players */
  .me-card { margin:12px; padding:14px; border-radius:12px; background:linear-gradient(135deg,rgba(224,181,50,.16),rgba(46,157,95,.12)); border:1px solid rgba(224,181,50,.35); }
  .me-card .big { font-size:28px; font-weight:900; color:var(--gold); line-height:1; }
  .me-card .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .me-card form { display:flex; gap:8px; margin-top:10px; }
  .me-card input { flex:1; min-width:0; background:#0f1315; border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:9px 11px; font:inherit; font-size:16px; }
  .me-card button, .linkbtn { background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .fan { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .fan .r { width:30px; text-align:center; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums; }
  .fan .r.m { font-size:20px; }
  .fan .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .fan .c { color:var(--muted); font-size:12px; }
  .fan .p { font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; }
  .fan.me { background:rgba(224,181,50,.08); }
  .how { padding:12px 14px; color:var(--muted); font-size:13px; }

  /* Game pop-up. Phones/tablets: a bottom sheet under the video (the video stays visible and
     keeps playing; the rest of the page dims). Desktop: a card slides in beside the video. */
  .layer { position:fixed; inset:0; z-index:50; pointer-events:none; }
  .layer.open { pointer-events:auto; }
  .dim { position:absolute; inset:0; top:var(--stage-b); background:rgba(0,0,0,.55); opacity:0; transition:opacity .25s; }
  .layer.open .dim { opacity:1; }
  .sheet { position:absolute; left:0; right:0; bottom:0; max-height:calc(100dvh - var(--stage-b) - 8px); overflow:auto; overscroll-behavior:contain;
    background:var(--panel2); border:1px solid rgba(224,181,50,.55); border-bottom:0; border-radius:18px 18px 0 0; padding:8px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .32s cubic-bezier(.2,.9,.25,1); box-shadow:0 -12px 40px rgba(0,0,0,.5); }
  .layer.open .sheet { transform:none; }
  .grab { width:40px; height:4px; border-radius:2px; background:#4a5258; margin:2px auto 8px; }
  @media (min-width:861px) {
    .layer { position:absolute; inset:0; z-index:20; border-radius:12px; overflow:hidden; }
    .dim { top:0; }
    .sheet { top:0; bottom:auto; max-height:100%; border:1px solid rgba(224,181,50,.55); border-radius:12px; transform:translateX(105%); box-shadow:-12px 0 40px rgba(0,0,0,.45); padding:14px 16px 16px; }
    .grab { display:none; }
  }
  .sheet .k { color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
  .sheet h3 { margin:4px 34px 2px 0; font-size:19px; line-height:1.25; }
  .sheet .q { margin:2px 0 12px; color:#dfe7e2; }
  .sheet .x { position:absolute; top:6px; right:6px; background:none; border:0; color:var(--muted); font-size:24px; cursor:pointer; width:40px; height:40px; }
  .sheet .opts { display:grid; gap:9px; }
  .opt { text-align:left; background:#0f1315; border:1.5px solid var(--line); border-radius:11px; color:var(--ink); padding:13px 14px; font-size:16px; cursor:pointer; position:relative; overflow:hidden; transition:border-color .2s, transform .1s; touch-action:manipulation; }
  .opt:active:not(:disabled) { transform:scale(.98); }
  .opt:disabled { cursor:default; }
  .opt .bar2 { position:absolute; inset:0 auto 0 0; background:rgba(46,157,95,.3); z-index:0; transition:width .7s; }
  .opt span { position:relative; z-index:1; }
  .opt .pct { float:right; font-weight:800; }
  .opt.mine { border-color:var(--gold); }
  .opt.wrong { border-color:var(--under); background:rgba(255,107,107,.08); }
  .opt.right { border-color:var(--green); background:rgba(46,157,95,.16); }
  .opt.right::after { content:"✓"; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#7fe0a8; font-weight:900; z-index:1; }
  .time { height:4px; background:var(--line); border-radius:2px; margin-top:14px; overflow:hidden; }
  .time i { display:block; height:100%; background:var(--gold); transition:width 1s linear; }
  .res { margin-top:12px; font-weight:700; min-height:1px; }
  .res .plus { color:var(--gold); }
  .sheet.shake { animation:shake .4s; }
  @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  .wheel-wrap { position:relative; width:min(220px,32vh); margin:4px auto 14px; }
  .wheel { width:100%; aspect-ratio:1; border-radius:50%; border:4px solid var(--gold); position:relative; transition:transform 3.2s cubic-bezier(.17,.67,.21,1); }
  .wheel-wrap::after { content:""; position:absolute; top:-4px; left:50%; transform:translateX(-50%); border:10px solid transparent; border-top:16px solid var(--live); }
  .wheel b { position:absolute; left:50%; top:50%; transform-origin:0 0; font-size:11px; color:#fff; text-shadow:0 1px 2px #000; white-space:nowrap; }
  .go { display:block; width:100%; background:var(--live); border:0; color:#fff; border-radius:11px; padding:14px; font-size:16px; font-weight:800; cursor:pointer; text-align:center; text-decoration:none; }
  .go:disabled { opacity:.6; }
  .prize { display:inline-block; margin:2px 0 12px; padding:4px 10px; border-radius:999px; background:rgba(224,181,50,.15); color:var(--gold); font-size:13px; font-weight:700; }
  .sheet input[type=tel] { width:100%; background:#0f1315; border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:12px; font:inherit; font-size:16px; }
  .check { display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--muted); margin:10px 0 12px; }
  .row2 { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .small-btn { background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; }
  .sheet.won { border-color:var(--gold); background:radial-gradient(circle at 50% 0%,#4a3510,#1b2024 65%); text-align:center; }
  .sheet.won h3 { margin:6px 0 4px; font-size:24px; }
  .trophy { font-size:72px; line-height:1; margin:6px auto 4px; display:inline-block; animation:trophy 1.1s cubic-bezier(.2,1.6,.4,1) both, glow 2s 1.1s infinite; }
  @keyframes trophy { 0% { transform:scale(.2) rotate(-25deg); opacity:0; } 60% { transform:scale(1.25) rotate(8deg); opacity:1; } 100% { transform:none; } }
  @keyframes glow { 50% { filter:drop-shadow(0 0 14px rgba(224,181,50,.8)); } }
  /* "✓ Correct!" badge */
  .badge { display:flex; align-items:center; gap:12px; margin:4px 0 12px; padding:12px 14px; border-radius:14px; background:linear-gradient(135deg,#1f6b43,#2e9d5f); animation:badge .5s cubic-bezier(.2,1.5,.4,1) both; }
  .badge .tick { width:44px; height:44px; flex:none; border-radius:50%; background:#fff; color:#1f6b43; display:grid; place-items:center; font-size:26px; font-weight:900; animation:badge .5s .12s cubic-bezier(.2,1.8,.4,1) both; }
  .badge strong { font-size:20px; display:block; line-height:1.1; }
  .badge small { font-size:14px; font-weight:700; color:#fff3c4; }
  @keyframes badge { from { transform:scale(.4); opacity:0; } }
  .confetti { position:fixed; inset:0; pointer-events:none; z-index:80; width:100vw; height:100vh; }
  @media (prefers-reduced-motion: reduce) { .floats span, .trophy, .badge, .badge .tick, .sheet.shake, .gamepill { animation:none !important; } .sheet { transition:none; } }

  /* "Remind me" on the placeholder */
  .remind { margin:16px auto 0; width:100%; text-align:left; }
  .remind-row { display:flex; gap:8px; }
  .remind input[type=tel] { flex:1; min-width:0; background:#0f1315; border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:10px 12px; font:inherit; font-size:16px; }
  .remind button { background:var(--live); border:0; color:#fff; border-radius:8px; padding:0 14px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .remind-ok { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  .remind-msg { font-size:12px; color:var(--under); min-height:14px; margin-top:4px; }
  .remind.done { color:#cfe6d8; font-size:14px; margin-top:16px; }

  /* Phones and tablets (portrait): one screen, video on top, tabs below scroll inside. */
  @media (max-width:860px) {
    .wrap.event { padding:0; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
    .wrap.event header.top { padding:8px 12px 6px; margin:0; flex:none; }
    .wrap.event h1 { font-size:16px; }
    .wrap.event header.top.tv { border-radius:0; border-width:0 0 1px 0; border-left:0; padding:8px 12px; }
    .wrap.event .logo, .wrap.event .logo img { height:34px; max-height:34px; max-width:110px; }
    .wrap.event .logo .gl span { display:none; }
    body.f-sport .wrap.event h1 { font-size:19px; }
    .wrap.event header.top.tv h1 { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.1; }
    .wrap.event header.top.tv .brand, .wrap.event header.top.tv .sub { display:none; }
    .wrap.event .clock { font-size:12px; padding:3px 6px; }
    .wrap.event .grid { display:flex; flex-direction:column; flex:1; min-height:0; gap:0; }
    .wrap.event .main { flex:none; position:relative; z-index:55; background:var(--bg); }
    .wrap.event .player { border-radius:0; }
    .wrap.event .bar { margin:0; padding:8px 12px; gap:6px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    .wrap.event .bar::-webkit-scrollbar { display:none; }
    .wrap.event .rx { width:38px; height:38px; font-size:18px; flex:none; }
    .wrap.event .pts, .wrap.event .btn, .wrap.event .gamepill, .wrap.event .chip-draw { flex:none; height:38px; }
    .wrap.event .side-wrap { flex:1; min-height:0; display:flex; }
    .wrap.event .side { flex:1; border-radius:0; border-width:1px 0 0; }
    .wrap.event .chat { height:auto; }
    .wrap.event .scroll { max-height:none; }
    .wrap.event footer { display:none; }
    .wrap.event .player.waiting { min-height:0; aspect-ratio:auto; height:min(62vh, max(260px, 56.25vw)); }
    .wrap.event .placeholder { overflow:auto; }
  }
  /* Phones turned sideways: the video takes the screen; tabs scroll below it. */
  @media (max-width:960px) and (orientation:landscape) and (max-height:500px) {
    .wrap.event { padding:0; }
    .wrap.event .grid { display:block; }
    .wrap.event .player { border-radius:0; max-height:100vh; aspect-ratio:auto; height:100vh; }
    .wrap.event .side { height:80vh; margin-top:8px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>
<script>
(() => {
  const app = document.getElementById('app');
  const id = (location.pathname.match(/\/watch\/([0-9a-f-]{36})/) || [])[1];
  const api = (p) => fetch(p, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : Promise.reject(r.status)));
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }

    return n;
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const livePill = (live) => el('span', { class: 'pill ' + (live ? 'live' : 'off'), text: live ? 'LIVE' : 'NOT LIVE' });
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const desktop = () => window.matchMedia('(min-width: 861px)').matches;
  const loadScript = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = rej; document.head.append(s); });

  // ------------------------------------------------------------ list of tournaments
  async function list() {
    document.title = 'Go Live · Watch';
    const data = await api('/api/public/live').catch(() => ({ tournaments: [] }));
    const items = data.tournaments.map((t) =>
      el('a', { href: '/watch/' + t.id },
        el('div', {}, el('strong', { text: t.name }), el('div', { class: 'sub', text: [t.venue, t.orgName, t.startsOn].filter(Boolean).join(' · ') })),
        livePill(t.live)));
    app.replaceChildren(
      el('header', { class: 'top' }, el('div', {}, el('div', { class: 'brand', text: 'Go Live' }), el('h1', { text: 'Live now' }))),
      el('div', { class: 'panel list' }, ...(items.length ? items : [el('div', { class: 'empty', text: 'No tournaments to show right now.' })])),
    );
    setTimeout(list, 30000);
  }

  // ------------------------------------------------------------ one tournament: the page parts
  let shownVideo = null, category = null, last = null;
  const playerBox = el('div', { class: 'player' });
  const floats = el('div', { class: 'floats', 'aria-hidden': 'true' });
  const stage = el('div', { class: 'stage' }, playerBox, floats);
  const bar = el('div', { class: 'bar' });
  const mainCol = el('div', { class: 'main' }, stage, bar);
  const boardPanel = el('div', { class: 'board' });
  const chatPanel = el('div', { class: 'chat' });
  const clipsPanel = el('div', { class: 'clipsTab' });
  const fansPanel = el('div', { class: 'fans' });
  const sideTabs = el('div', { class: 'tabs', role: 'tablist' });
  const sideBody = el('div', { class: 'body' });
  const sidePanel = el('div', { class: 'panel side' }, sideTabs, sideBody);
  const sideWrap = el('div', { class: 'side-wrap' }, sidePanel);
  let sideTab = 'board', unread = 0, hasBoard = true, clipCount = 0, tInfo = null;
  const head = el('header', { class: 'top' });

  // The game pop-up layer (bottom sheet on phones, beside the video on desktop).
  const dim = el('div', { class: 'dim' });
  const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'false', tabindex: '-1' });
  const layer = el('div', { class: 'layer', 'aria-hidden': 'true' }, dim, sheet);
  function placeLayer() {
    const host = desktop() ? sideWrap : document.body;
    if (layer.parentNode !== host) host.append(layer);
    const b = mainCol.getBoundingClientRect().bottom;
    document.documentElement.style.setProperty('--stage-b', Math.max(0, Math.round(desktop() ? 0 : b)) + 'px');
  }
  window.addEventListener('resize', placeLayer);
  if (window.ResizeObserver) new ResizeObserver(placeLayer).observe(mainCol);

  // ------------------------------------------------------------ player (YouTube IFrame API) + viewership
  // The video is YouTube's player or ours; both tell us when it plays and is muted, so the
  // viewer clock counts only real watching (playing, tab visible). Reports go to our server
  // every 30 s and when the page is hidden or closed.
  let ytApi = null, player = null, ytPlaying = false;
  // Our own player (HLS through the CDN). Its scripts load only when this event uses it.
  let ours = null, shownSrc = null, playerLib = null;
  const playingNow = () => ours ? ours.isPlaying() : Boolean(player && ytPlaying);
  function ensurePlayer() {
    return playerLib || (playerLib = (async () => {
      const v = document.createElement('video');
      const nativeOnly = !window.MediaSource && !window.ManagedMediaSource && v.canPlayType('application/vnd.apple.mpegurl');
      if (!nativeOnly && !window.Hls) await loadScript('/site/hls-1.5.20.light.min.js').catch(() => {});
      if (!window.GoLivePlayer) await loadScript('/site/player.js');
    })().catch(() => { playerLib = null; }));
  }
  async function mountOurs(src, live, title) {
    if (ours) ours.destroy();
    ours = null; player = null; ytPlaying = false;
    playerBox.replaceChildren(el('div', { class: 'placeholder' }, el('div', { class: 'sub', text: 'Loading the video…' })));
    await ensurePlayer();
    if (shownSrc !== src || !window.GoLivePlayer) return;
    ours = GoLivePlayer.mount(playerBox, { src, live, title, onPlaying: (v) => { if (v) startView(); } });
  }
  function unmountOurs() { if (ours) { ours.destroy(); ours = null; } shownSrc = null; }
  const loadYt = () => ytApi || (ytApi = new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(window.YT); };
    const sc = document.createElement('script');
    sc.src = 'https://www.youtube.com/iframe_api';
    sc.onerror = reject;
    document.head.append(sc);
    setTimeout(() => reject(new Error('timeout')), 8000);
  }));

  function plainIframe(t) {
    playerBox.replaceChildren(el('iframe', {
      src: t.youtube.embedUrl, title: t.name,
      allow: 'autoplay; encrypted-media; picture-in-picture; fullscreen', allowfullscreen: 'true', referrerpolicy: 'strict-origin-when-cross-origin',
    }));
  }

  async function mountPlayer(t) {
    const holder = el('div', { id: 'yt-player' });
    playerBox.replaceChildren(holder);
    try {
      const YT = await loadYt();
      player = new YT.Player(holder, {
        videoId: t.youtube.videoId,
        host: 'https://www.youtube.com',
        playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, origin: location.origin },
        events: {
          onReady: (e) => { try { e.target.mute(); e.target.playVideo(); } catch {} },
          onStateChange: (e) => { ytPlaying = e.data === 1; if (ytPlaying) startView(); },
        },
      });
      const f = playerBox.querySelector('iframe');
      if (f) f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
    } catch {
      // The API did not load (blocked or offline): still play the video, without the viewer clock.
      player = null;
      plainIframe(t);
    }
  }

  const VIEWER_KEY = 'gl_viewer';
  // Influencer link (?r=<slug>): kept for this event so a reload or a later visit keeps the credit.
  const REF_KEY = 'gl_ref_' + id;
  (() => {
    const r = new URLSearchParams(location.search).get('r');
    if (r && /^[a-z0-9-]{1,40}$/.test(r) && !store.get(REF_KEY)) store.set(REF_KEY, JSON.stringify({ r, at: Date.now() }));
  })();
  // Another viewer's share link (?s=<code>), e.g. a winner's: kept so they get the credit.
  const SHARE_KEY = 'gl_s_' + id;
  (() => { const v = new URLSearchParams(location.search).get('s'); if (v && /^[A-Za-z0-9_-]{6,16}$/.test(v) && !store.get(SHARE_KEY)) store.set(SHARE_KEY, v); })();
  const sharedBy = () => store.get(SHARE_KEY);
  const refSlug = () => { try { const v = JSON.parse(store.get(REF_KEY) || 'null'); return v && Date.now() - v.at < 30 * 86400000 ? v.r : null; } catch { return null; } };
  const view = { token: null, starting: null, clock: 0, streamClockSec: null, streamAt: 0, live: false, pendPlay: 0, pendUnmuted: 0, lastSend: Date.now() };
  // Started when the video first plays (that is when the viewer clock starts), or when a live
  // game opens, so nobody misses a quiz because the video was paused.
  function startView() {
    if (view.token || view.starting || !id) return view.starting;
    view.starting = fetch(`/api/public/tournaments/${id}/view`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ viewerKey: store.get(VIEWER_KEY), ref: refSlug(), sharedBy: sharedBy() }),
    }).then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((j) => {
      view.token = j.token;
      view.clock = j.watchedSec;
      games.visits = j.visits || 1;
      games.shareCode = j.shareCode || null;
      for (const k of j.done || []) games.done.add(k);
      for (const w of j.wins || []) if (w.status === 'won') queueWin(w);
      view.live = j.live;
      setStreamClock(j.streamClockSec);
      store.set(VIEWER_KEY, j.viewerKey);
      fans.points = j.points || 0;
      fans.name = j.nickname || null;
      drawBar();
      if (!fans.name && chatAuth) setNickname(chatAuth.name, true);
    }).catch(() => {}).finally(() => { view.starting = null; });
    return view.starting;
  }
  function setStreamClock(sec) { view.streamClockSec = sec; view.streamAt = Date.now(); }
  const unmuted = () => { try { return ours ? ours.isUnmuted() : Boolean(player && !player.isMuted() && player.getVolume() > 0); } catch { return false; } };

  function report(beacon) {
    if (!view.token || (!view.pendPlay && !beacon)) return;
    const body = JSON.stringify({ token: view.token, playingSec: view.pendPlay, unmutedSec: view.pendUnmuted });
    view.pendPlay = 0; view.pendUnmuted = 0; view.lastSend = Date.now();
    if (beacon && navigator.sendBeacon) { navigator.sendBeacon('/api/public/view/beat', new Blob([body], { type: 'text/plain' })); return; }
    fetch('/api/public/view/beat', { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: true })
      .then((r) => r.ok ? r.json() : null).then((j) => { if (j) { view.live = j.live; setStreamClock(j.streamClockSec); for (const w of j.wins || []) queueWin(w); } }).catch(() => {});
  }
  setInterval(() => {
    if (playingNow() && !document.hidden && view.token) {
      view.pendPlay++; view.clock++;
      if (unmuted()) view.pendUnmuted++;
    }
    if (Date.now() - view.lastSend >= 30000) report(false);
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) report(true); });
  window.addEventListener('pagehide', () => report(true));
  window.goLiveClocks = {
    viewer: () => view.clock,
    stream: () => view.streamClockSec == null ? null : view.streamClockSec + Math.floor((Date.now() - view.streamAt) / 1000),
    unmuted,
  };

  // ------------------------------------------------------------ celebrations
  // A tiny confetti burst on a canvas (no library). Bigger for prizes. Nothing when the viewer
  // asked for less motion.
  function confetti(big) {
    if (reduced()) return;
    const c = el('canvas', { class: 'confetti' });
    document.body.append(c);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    const x = c.getContext('2d');
    x.scale(dpr, dpr);
    const colors = ['#e0b532', '#2e9d5f', '#e53935', '#ffffff', '#4aa3ff', '#ff8a3d'];
    const ps = [];
    const burst = (ox, oy, n, spread, up) => {
      for (let i = 0; i < n; i++) {
        const a = (-Math.PI / 2) + (Math.random() - 0.5) * spread;
        const v = up * (0.6 + Math.random() * 0.6);
        ps.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: colors[i % colors.length], life: 0 });
      }
    };
    const origin = sheet.getBoundingClientRect();
    const oy = Math.min(H * 0.8, origin.top > 0 ? origin.top + 60 : H * 0.6);
    if (big) { burst(W * 0.15, H, 110, 1.0, 19); burst(W * 0.85, H, 110, 1.0, 19); burst(W / 2, oy, 90, 2.4, 14); }
    else burst(origin.width ? origin.left + origin.width / 2 : W / 2, oy, 90, 2.0, 13);
    const end = performance.now() + (big ? 3600 : 2200);
    (function frame(now) {
      x.clearRect(0, 0, W, H);
      for (const p of ps) {
        p.vy += 0.32; p.vx *= 0.992; p.vy *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
        x.globalAlpha = Math.max(0, Math.min(1, (end - now) / 600));
        x.fillRect(-p.w / 2, -p.h / 4, p.w, p.h / 2 * (0.6 + 0.4 * Math.sin(p.r * 3)));
        x.restore();
      }
      if (now < end) requestAnimationFrame(frame); else c.remove();
    })(performance.now());
  }
  const badge = (title, sub) => el('div', { class: 'badge', role: 'status' }, el('div', { class: 'tick', text: '✓' }), el('div', {}, el('strong', { text: title }), sub ? el('small', { text: sub }) : null));

  // ------------------------------------------------------------ live reactions 👏 🔥 ⛳
  const RX = { clap: '👏', fire: '🔥', golf: '⛳' };
  const rx = { last: null, mine: { clap: 0, fire: 0, golf: 0 } };
  function floatUp(emoji, delay = 0) {
    if (floats.childElementCount > 24) return;
    const s = el('span', { text: emoji });
    const dx = (Math.random() - 0.5) * 40;
    s.style.setProperty('--dx1', dx.toFixed(0) + 'px');
    s.style.setProperty('--dx2', (-dx * 0.8).toFixed(0) + 'px');
    s.style.animationDelay = delay + 'ms';
    s.addEventListener('animationend', () => s.remove());
    floats.append(s);
  }
  function react(kind, btn) {
    floatUp(RX[kind]);
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    rx.mine[kind]++;
    fetch(`/api/public/tournaments/${id}/react`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind }) }).catch(() => {});
  }
  // Everyone else's reactions arrive with the games feed (every few seconds) and float up too.
  function othersReacted(totals) {
    if (!totals) return;
    if (rx.last && !document.hidden) {
      let i = 0;
      for (const k of Object.keys(RX)) {
        let n = (totals[k] || 0) - (rx.last[k] || 0) - rx.mine[k];
        n = Math.max(0, Math.min(8, n));
        for (let j = 0; j < n; j++) floatUp(RX[k], (i++) * 220 + Math.random() * 300);
      }
    }
    rx.last = totals; rx.mine = { clap: 0, fire: 0, golf: 0 };
  }

  // ------------------------------------------------------------ bar under the video
  const drawSlot = el('span');
  function drawBar() {
    const t = tInfo;
    const hasGames = Boolean(games.feed && games.feed.moments && games.feed.moments.length);
    const c = games.current;
    bar.replaceChildren(...[
      ...Object.entries(RX).map(([k, e]) => { const b = el('button', { class: 'rx', type: 'button', 'aria-label': 'React ' + e, text: e }); b.onclick = () => react(k, b); return b; }),
      c && c.min ? el('button', { class: 'gamepill', type: 'button', onclick: () => openSheet(), text: '🎯 ' + (LABEL[c.m.type] || 'Game') + ' open · play' }) : null,
      drawSlot,
      hasGames || fans.points ? el('button', { class: 'pts' + (fans.bump ? ' bump' : ''), type: 'button', title: 'Your points: see Top players', onclick: () => { sideTab = 'games'; drawSide(); }, text: '⭐ ' + fans.points }) : null,
      el('span', { class: 'sp' }),
      t && t.youtube ? el('a', { class: 'btn', href: t.youtube.watchUrl, target: '_blank', rel: 'noopener', text: 'YouTube' }) : null,
      t && t.facebookUrl ? el('a', { class: 'btn', href: t.facebookUrl, target: '_blank', rel: 'noopener', text: 'Facebook' }) : null,
      el('button', { class: 'btn', type: 'button', onclick: () => t && share(t), text: 'Share' })].filter(Boolean));
    fans.bump = false;
  }

  // ------------------------------------------------------------ games (moments) on three clocks
  // viewer clock: this viewer's watched seconds · stream clock: since the first Go live ·
  // director: fired live. One pop-up at a time (director first, then stream, then viewer), with a
  // gap between them. The server checks every play and decides every result.
  const games = { feed: null, done: new Set(), current: null, lastShownAt: 0, visits: 1, wins: [] };
  const ansKey = 'gl_ans_' + id;
  const myAnswers = (() => { try { return JSON.parse(store.get(ansKey) || '{}'); } catch { return {}; } })();
  const saveAnswer = (key, ans) => { myAnswers[key] = ans; store.set(ansKey, JSON.stringify(myAnswers)); };
  const settledShown = new Set();

  async function pollGames() {
    try {
      const f = await api(`/api/public/tournaments/${id}/moments`);
      const had = Boolean(games.feed && games.feed.moments.length);
      games.feed = f;
      if (f.streamClockSec != null && view.streamClockSec == null) setStreamClock(f.streamClockSec);
      othersReacted(f.reactions);
      // A live game is open: start the viewer even if the video hasn't played yet.
      const offset = f.serverTime ? Date.parse(f.serverTime) - Date.now() : 0;
      if (!view.token && f.runs.some((r) => Date.parse(r.closesAt) - offset > Date.now())) startView();
      // Predictions settled since: tell the viewer how they did.
      for (const r of f.runs) {
        const k = r.momentId + ':' + r.runKey;
        if (r.correctOption && myAnswers[k] && !settledShown.has(k) && !store.get('gl_told_' + k)) {
          settledShown.add(k); store.set('gl_told_' + k, '1');
          const m = f.moments.find((x) => x.id === r.momentId);
          if (m) games.results.push({ m, right: myAnswers[k] === r.correctOption, answer: (m.options.find((o) => o.id === r.correctOption) || {}).text || '' });
        }
      }
      if (had !== Boolean(f.moments.length)) drawBar();
    } catch {}
    setTimeout(pollGames, document.hidden ? 15000 : 4000);
  }
  games.results = [];

  function inAudience(m) {
    if (m.audience === 'unmuted') return goLiveClocks.unmuted();
    if (m.audience === 'ref') return refSlug() === m.audienceRef;
    if (m.audience === 'new') return games.visits <= 1;
    if (m.audience === 'returning') return games.visits > 1;
    return true;
  }

  function nextGame() {
    const f = games.feed;
    if (!f || !view.token) return null;
    const now = Date.now();
    const offset = f.serverTime ? Date.parse(f.serverTime) - now : 0;
    const cands = [];
    const byId = new Map(f.moments.map((m) => [m.id, m]));
    for (const r of f.runs) {
      const m = byId.get(r.momentId);
      const key = r.momentId + ':' + r.runKey;
      if (!m || games.done.has(key) || !inAudience(m)) continue;
      const closes = Date.parse(r.closesAt) - offset;
      if (now < closes) cands.push({ m, runKey: r.runKey, key, until: closes, prio: m.clock === 'director' ? 0 : 1 });
      else if (m.lateJoin && Date.parse(r.startedAt) > now - 30 * 60000) cands.push({ m, runKey: r.runKey, key, until: now + m.openSec * 1000, prio: 1 });
    }
    const clock = goLiveClocks.viewer();
    for (const m of f.moments) {
      if (m.clock !== 'viewer' || !inAudience(m)) continue;
      for (let n = 0; n < m.repeatMax; n++) {
        const due = m.atSec + n * (m.repeatEverySec || 0);
        if (clock < due) break;
        const key = m.id + ':v' + n;
        if (games.done.has(key)) continue;
        cands.push({ m, runKey: 'v' + n, key, until: now + m.openSec * 1000, prio: 2 });
        break;
      }
    }
    cands.sort((a, b) => a.prio - b.prio);
    const c = cands[0];
    if (!c) return null;
    // Gap between pop-ups (the director's games skip the wait).
    if (c.prio > 0 && now - games.lastShownAt < (f.gapSec || 0) * 1000) return null;
    return c;
  }

  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error((j.error && j.error.message) || 'Try again'); return j; });

  // The layer: open shows the sheet; tapping the dim area tucks an unplayed game into a
  // "Quiz open · play" button under the video (it keeps its time); × closes it.
  let autoClose = null;
  function openSheet() {
    placeLayer();
    if (games.current) games.current.min = false;
    layer.classList.add('open'); layer.setAttribute('aria-hidden', 'false');
    drawBar();
    setTimeout(() => { try { sheet.focus({ preventScroll: true }); } catch {} }, 50);
  }
  function hideSheet() { layer.classList.remove('open'); layer.setAttribute('aria-hidden', 'true'); }
  dim.onclick = () => {
    const c = games.current;
    if (c && !c.played && c.m.id !== 'win' && c.m.id !== 'result') { c.min = true; hideSheet(); drawBar(); return; }
    closeCard();
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && layer.classList.contains('open')) closeCard('dismissed'); });
  function later(ms) { clearTimeout(autoClose); autoClose = setTimeout(() => closeCard(), ms); }

  function closeCard(kind) {
    clearTimeout(autoClose);
    const c = games.current;
    hideSheet();
    if (!c) return;
    clearInterval(c.timer);
    games.current = null;
    // A closed lucky draw can be opened again from a small button under the video.
    if (c.m.type === 'draw' && !c.played) {
      drawSlot.replaceChildren(el('button', { class: 'chip-draw', type: 'button', text: '🎟 Lucky draw', onclick: () => { drawSlot.replaceChildren(); c.until = Date.now() + c.m.openSec * 1000; showCard(c, true); } }));
    }
    if (kind === 'dismissed' && !c.played && c.runKey) post(`/api/public/moments/${c.m.id}/seen`, { token: view.token, runKey: c.runKey, kind: 'dismissed' }).catch(() => {});
    drawBar();
  }

  function frame(c, k, title, ...body) {
    sheet.className = 'sheet';
    sheet.setAttribute('aria-label', title);
    sheet.replaceChildren(el('div', { class: 'grab' }),
      el('button', { class: 'x', type: 'button', 'aria-label': 'Close', text: '×', onclick: () => closeCard('dismissed') }),
      el('div', { class: 'k', text: k }),
      el('h3', { text: title }),
      ...body.filter((x) => x != null));

    composer.onsubmit = async (e) => {
      e.preventDefault();
      if (!text.value.trim()) return;
      send.disabled = true; note.className = 'note'; note.textContent = '';
      try {
        const r = await fetch(`/api/public/tournaments/${id}/chat`, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + chatAuth.token }, body: JSON.stringify({ text: text.value }) });
        const j = await r.json();
        if (r.status === 401) { chatAuth = null; store.set(chatKey, 'null'); renderComposer(); return; }
        if (!r.ok) throw new Error(j.error && j.error.message);
        text.value = '';
        addMessages([j.message], true);
      } catch (err) { note.className = 'note err'; note.textContent = err.message || 'Message not sent.'; }
      setTimeout(() => { send.disabled = false; }, chatState.slowSec * 1000);
    };
    composer.replaceChildren(text, send);
    note.className = 'note';
    note.textContent = 'Comments from YouTube and Facebook appear here too. Be kind: messages are moderated.';
  }

  function addMessages(ms, mine) {
    const stick = mine || nearBottom();
    let added = 0;
    for (const m of ms) {
      if (chatState.msgs.has(m.id)) continue;
      chatState.msgs.set(m.id, m);
      chatState.last = Math.max(chatState.last, m.id);
      chatList.append(msgEl(m));
      added++;
    }
    while (chatList.children.length > 300) { const first = chatList.firstChild; chatState.msgs.delete(Number(first.dataset.id)); first.remove(); }
    if (!added) return;
    if (stick) chatList.scrollTop = chatList.scrollHeight; else newBtn.hidden = false;
    if (sideTab !== 'chat' && !mine) { unread += added; drawTabs(); }
  }

  async function pollChat() {
    try {
      const q = `after=${chatState.last}` + (chatState.version != null ? `&v=${chatState.version}` : '');
      const d = await api(`/api/public/tournaments/${id}/chat?${q}`);
      const enabledChanged = d.enabled !== chatState.enabled;
      chatState.enabled = d.enabled; chatState.slowSec = d.slowSec; chatState.version = d.version;
      if (!d.unchanged) {
        const stick = chatState.last === 0 || nearBottom();
        for (const hid of d.hidden || []) { const n = chatList.querySelector(`[data-id="${hid}"]`); if (n) n.remove(); chatState.msgs.delete(hid); }
        addMessages(d.messages || [], false);
        const p = d.pinned;
        pinBox.replaceChildren(...(p ? [el('div', { class: 'pinned' }, el('span', { class: 'k', text: `Pinned · ${SRC_NAME[p.source] || ''}` }), el('strong', { text: p.author + ' ' }), document.createTextNode(p.text))] : []));
        if (stick) { chatList.scrollTop = chatList.scrollHeight; newBtn.hidden = true; }
      }
      if (enabledChanged) renderComposer();
    } catch {}
    setTimeout(pollChat, document.hidden ? 10000 : 3000);
  }

  // ------------------------------------------------------------ tabs: Chat · Leaderboard · Clips · Games
  function drawTabs() {
    const tab = (k, label, extra) => el('button', { class: sideTab === k ? 'on' : '', role: 'tab', 'aria-selected': String(sideTab === k), type: 'button', onclick: () => { sideTab = k; if (k === 'chat') unread = 0; drawSide(); } }, label, extra || null);
    sideTabs.replaceChildren(...[
      tab('chat', 'Chat', unread ? el('span', { class: 'count', text: unread > 99 ? '99+' : String(unread) }) : null),
      hasBoard ? tab('board', 'Leaderboard') : null,
      clipCount ? tab('clips', 'Clips') : null,
      tab('games', 'Games'),
    ].filter(Boolean));
  }
  function drawSide() {
    if (sideTab === 'board' && !hasBoard) sideTab = 'chat';
    drawTabs();
    sideBody.replaceChildren({ chat: chatPanel, board: boardPanel, clips: clipsPanel, games: fansPanel }[sideTab] || chatPanel);
    if (sideTab === 'chat') { chatList.scrollTop = chatList.scrollHeight; newBtn.hidden = true; }
    if (sideTab === 'games') { drawFans(); loadFans(); }
  }

  // ------------------------------------------------------------ V8: event theme (colours, type) and TV clock
  const GL_MARK = '<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="#ee3b2f"/><circle cx="15" cy="15" r="10.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="46 20" stroke-linecap="round"/><path d="M12.6 10.4v9.2l7.4-4.6z" fill="#fff"/></svg>';
  let themeSig = '';
  function applyTheme(b) {
    if (!b || !b.colors) return;
    const sig = JSON.stringify(b.colors) + b.font;
    if (sig === themeSig) return;
    themeSig = sig;
    const r = document.documentElement.style;
    const c = b.colors;
    r.setProperty('--bg', c.bg); r.setProperty('--panel', c.panel); r.setProperty('--panel2', c.panel2); r.setProperty('--line', c.line);
    r.setProperty('--ink', c.ink); r.setProperty('--muted', c.muted); r.setProperty('--gold', c.accent); r.setProperty('--live', c.live);
    document.body.classList.remove('f-sport', 'f-elegant', 'f-festive', 'f-clean');
    document.body.classList.add('f-' + b.font);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', c.bg);
  }
  const clock = el('span', { class: 'clock', 'aria-label': 'Time' });
  const tickClock = () => { clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };
  tickClock();
  setInterval(tickClock, 15000);

  async function tournament() {
    try {
      const d = await api('/api/public/tournaments/' + id);
      const t = d.tournament;
      tInfo = t;
      document.title = t.name + ' · Go Live';
      applyTheme(d.branding);
      const sig = JSON.stringify([t.name, t.venue, t.live, d.onAir && d.onAir.hole, Boolean(t.youtube), t.facebookUrl, d.branding && d.branding.logoUrl]);
      if (sig !== last) {
        last = sig;
        const logo = el('div', { class: 'logo' });
        if (d.branding && d.branding.logoUrl) logo.append(el('img', { src: d.branding.logoUrl, alt: t.orgName || t.name, decoding: 'async' }));
        else logo.innerHTML = '<div class="gl">' + GL_MARK + '<span>GO LIVE</span></div>';
        head.className = 'top tv';
        head.replaceChildren(logo, el('div', { style: 'flex:1;min-width:0' },
          el('div', { class: 'brand', text: t.orgName || 'Go Live' }),
          el('h1', { text: t.name }),
          el('div', { class: 'sub', text: [t.venue, d.onAir && d.onAir.hole ? 'On camera: hole ' + d.onAir.hole : null].filter(Boolean).join(' · ') })),
          clock, livePill(t.live));
        drawBar();
        placeLayer();
      }
      renderPlayer(t, d.watch);
      // Golf events show the leaderboard; other kinds of event go straight to the chat.
      const golf = !t.eventType || t.eventType === 'golf';
      if (!golf && hasBoard) { hasBoard = false; drawSide(); }
      renderBoard(d.leaderboard);
      renderClips(d.clips || []);
    } catch (e) {
      if (e === 404) { app.className = 'wrap'; app.replaceChildren(el('p', { class: 'sub', text: 'This tournament is not available.' })); return; }
    }
    setTimeout(tournament, 10000);
  }

  if (!id) { list(); return; }
  app.className = 'wrap event';
  app.replaceChildren(head,
    el('div', { class: 'grid' }, mainCol, sideWrap),
    el('footer', { text: 'Produced with Go Live' }));
  const want = new URLSearchParams(location.search).get('tab');
  if (['chat', 'board', 'clips', 'games'].includes(want)) sideTab = want;
  drawBar();
  drawSide();
  placeLayer();
  renderComposer();
  tournament();
  pollChat();
  pollGames();
})();
</script>
</body>
</html>
