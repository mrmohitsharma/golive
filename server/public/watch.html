<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Go Live</title>
<style>
  :root { --bg:#0b0e10; --panel:#15191c; --line:#252b30; --ink:#f3f5f4; --muted:#9aa5a0; --live:#e53935; --green:#2e7d4f; --gold:#c9a227; --under:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:inherit; }
  .wrap { max-width:1180px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .brand { font-weight:800; letter-spacing:.06em; font-size:12px; color:var(--gold); text-transform:uppercase; }
  h1 { font-size:22px; margin:2px 0 0; }
  .sub { color:var(--muted); font-size:14px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:6px; font-size:12px; font-weight:800; letter-spacing:.05em; }
  .pill.live { background:var(--live); }
  .pill.live::before { content:""; width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1.2s infinite; }
  .pill.off { background:#3a4247; color:#cfd6d2; }
  @keyframes blink { 50% { opacity:.25; } }
  .grid { display:grid; grid-template-columns: minmax(0,2fr) minmax(280px,1fr); gap:16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .player { position:relative; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  .player iframe, .player #yt-player { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .placeholder { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; background:linear-gradient(135deg,#123222,#0b0e10); color:#dfe7e2; }
  .links { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 0; }
  .btn { display:inline-block; padding:7px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--line); text-decoration:none; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .panel h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin:0; padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px 0; }
  .chip { padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--ink); font-size:13px; cursor:pointer; }
  .chip.on { background:var(--green); border-color:var(--green); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:8px 14px; text-align:left; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-size:12px; font-weight:600; }
  td.num, th.num { text-align:right; }
  .under { color:var(--under); font-weight:700; }
  .club { color:var(--muted); font-size:12px; display:block; }
  .scroll { max-height:520px; overflow:auto; }
  .clips { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:14px; }
  .clip { text-decoration:none; }
  .clip img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; background:#000; display:block; }
  .clip span { display:block; font-size:14px; margin-top:6px; }
  .clip small { color:var(--muted); }
  .list a { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--line); text-decoration:none; }
  .empty { padding:16px 14px; color:var(--muted); }
  footer { color:var(--muted); font-size:12px; margin-top:20px; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:12px 8px 9px; cursor:pointer; }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--gold); }
  .tabs .count { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--live); color:#fff; font-size:11px; line-height:18px; }
  .side { display:flex; flex-direction:column; min-height:0; }
  .chat { display:flex; flex-direction:column; height:460px; }
  .board { display:flex; flex-direction:column; }
  /* Desktop: the side panel is exactly as tall as the video column and scrolls inside. */
  @media (min-width: 861px) {
    .side { height:0; min-height:100%; }
    .side > .body { flex:1; min-height:0; display:flex; flex-direction:column; }
    .side .board, .side .chat { flex:1; min-height:360px; height:auto; }
    .side .board .scroll { flex:1; max-height:none; }
  }
  .chat .list { flex:1; min-height:0; overflow-y:auto; padding:8px 0; }
  .side { overflow:hidden; }
  .msg { display:flex; gap:9px; padding:6px 14px; align-items:flex-start; }
  .msg .src { flex:none; width:20px; height:20px; border-radius:5px; display:grid; place-items:center; margin-top:1px; }
  .msg .src svg { width:13px; height:13px; fill:#fff; }
  .src.youtube { background:#ff0033; } .src.facebook { background:#1877f2; } .src.watch { background:var(--green); }
  .msg .who { font-weight:700; font-size:13px; color:#cfe6d8; margin-right:6px; }
  .msg .txt { font-size:14px; overflow-wrap:anywhere; }
  .msg.q .txt { color:#fff; }
  .msg.mine .who { color:var(--gold); }
  .pinned { margin:10px 12px 2px; padding:9px 12px; border:1px solid var(--gold); border-radius:8px; background:rgba(201,162,39,.08); font-size:14px; }
  .pinned .k { color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:2px; }
  .composer { border-top:1px solid var(--line); padding:10px 12px; display:flex; gap:8px; }
  .composer input { flex:1; min-width:0; background:#0f1315; border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:9px 11px; font:inherit; font-size:14px; }
  .composer button { background:var(--green); border:0; color:#fff; border-radius:8px; padding:0 14px; font:inherit; font-weight:700; cursor:pointer; }
  .composer button:disabled { opacity:.5; cursor:default; }
  .chat .note { padding:0 12px 10px; font-size:12px; color:var(--muted); min-height:16px; }
  .chat .note.err { color:var(--under); }
  .chat .new { align-self:center; margin:-40px 0 8px; position:relative; background:var(--gold); color:#111; border:0; border-radius:999px; padding:4px 12px; font-size:12px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>
<script>
(() => {
  const app = document.getElementById('app');
  const id = (location.pathname.match(/\/watch\/([0-9a-f-]{36})/) || [])[1];
  const api = (p) => fetch(p, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : Promise.reject(r.status)));
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const livePill = (live) => el('span', { class: 'pill ' + (live ? 'live' : 'off'), text: live ? 'LIVE' : 'NOT LIVE' });

  // ------------------------------------------------------------ list of tournaments
  async function list() {
    document.title = 'Go Live · Watch';
    const data = await api('/api/public/live').catch(() => ({ tournaments: [] }));
    const items = data.tournaments.map((t) =>
      el('a', { href: '/watch/' + t.id },
        el('div', {}, el('strong', { text: t.name }), el('div', { class: 'sub', text: [t.venue, t.orgName, t.startsOn].filter(Boolean).join(' · ') })),
        livePill(t.live)));
    app.replaceChildren(
      el('header', {}, el('div', {}, el('div', { class: 'brand', text: 'Go Live' }), el('h1', { text: 'Live now' }))),
      el('div', { class: 'panel list' }, ...(items.length ? items : [el('div', { class: 'empty', text: 'No tournaments to show right now.' })])),
    );
    setTimeout(list, 30000);
  }

  // ------------------------------------------------------------ one tournament
  let shownVideo = null, category = null, last = null;
  const playerBox = el('div', { class: 'player' });
  const linksBox = el('div', { class: 'links' });
  const boardPanel = el('div', { class: 'board' });
  const chatPanel = el('div', { class: 'chat' });
  const sideTabs = el('div', { class: 'tabs' });
  const sideBody = el('div', { class: 'body' });
  const sidePanel = el('div', { class: 'panel side' }, sideTabs, sideBody);
  let sideTab = 'board', unread = 0;
  const clipsPanel = el('div', { class: 'panel', style: 'margin-top:16px' });
  const head = el('header');

  // ------------------------------------------------------------ player (YouTube IFrame API) + viewership
  // The video is YouTube's player; the API tells us when it plays, pauses and is muted, so the
  // viewer clock counts only real watching (playing, tab visible). Reports go to our server
  // every 30 s and when the page is hidden or closed.
  let ytApi = null, player = null, ytPlaying = false;
  const loadYt = () => ytApi || (ytApi = new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(window.YT); };
    const sc = document.createElement('script');
    sc.src = 'https://www.youtube.com/iframe_api';
    sc.onerror = reject;
    document.head.append(sc);
    setTimeout(() => reject(new Error('timeout')), 8000);
  }));

  function plainIframe(t) {
    playerBox.replaceChildren(el('iframe', {
      src: t.youtube.embedUrl, title: t.name,
      allow: 'autoplay; encrypted-media; picture-in-picture; fullscreen', allowfullscreen: 'true', referrerpolicy: 'strict-origin-when-cross-origin',
    }));
  }

  async function mountPlayer(t) {
    const holder = el('div', { id: 'yt-player' });
    playerBox.replaceChildren(holder);
    try {
      const YT = await loadYt();
      player = new YT.Player(holder, {
        videoId: t.youtube.videoId,
        host: 'https://www.youtube.com',
        playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, origin: location.origin },
        events: {
          onReady: (e) => { try { e.target.mute(); e.target.playVideo(); } catch {} },
          onStateChange: (e) => { ytPlaying = e.data === 1; if (ytPlaying) startView(); },
        },
      });
      const f = playerBox.querySelector('iframe');
      if (f) f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
    } catch {
      // The API did not load (blocked or offline): still play the video, without the viewer clock.
      player = null;
      plainIframe(t);
    }
  }

  const VIEWER_KEY = 'gl_viewer';
  const view = { token: null, starting: null, clock: 0, streamClockSec: null, streamAt: 0, live: false, pendPlay: 0, pendUnmuted: 0, lastSend: Date.now() };
  // Started when the video first plays: that is when the viewer clock starts.
  function startView() {
    if (view.token || view.starting || !id) return view.starting;
    view.starting = fetch(`/api/public/tournaments/${id}/view`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ viewerKey: store.get(VIEWER_KEY) }),
    }).then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((j) => {
      view.token = j.token;
      view.clock = j.watchedSec;
      view.live = j.live;
      setStreamClock(j.streamClockSec);
      store.set(VIEWER_KEY, j.viewerKey);
    }).catch(() => {}).finally(() => { view.starting = null; });
    return view.starting;
  }
  function setStreamClock(sec) { view.streamClockSec = sec; view.streamAt = Date.now(); }
  const unmuted = () => { try { return player && !player.isMuted() && player.getVolume() > 0; } catch { return false; } };

  function report(beacon) {
    if (!view.token || (!view.pendPlay && !beacon)) return;
    const body = JSON.stringify({ token: view.token, playingSec: view.pendPlay, unmutedSec: view.pendUnmuted });
    view.pendPlay = 0; view.pendUnmuted = 0; view.lastSend = Date.now();
    if (beacon && navigator.sendBeacon) { navigator.sendBeacon('/api/public/view/beat', new Blob([body], { type: 'text/plain' })); return; }
    fetch('/api/public/view/beat', { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: true })
      .then((r) => r.ok ? r.json() : null).then((j) => { if (j) { view.live = j.live; setStreamClock(j.streamClockSec); } }).catch(() => {});
  }
  setInterval(() => {
    if (player && ytPlaying && !document.hidden && view.token) {
      view.pendPlay++; view.clock++;
      if (unmuted()) view.pendUnmuted++;
    }
    if (Date.now() - view.lastSend >= 30000) report(false);
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) report(true); });
  window.addEventListener('pagehide', () => report(true));
  // For the games (next step): the three clocks on this page.
  window.goLiveClocks = {
    viewer: () => view.clock,
    stream: () => view.streamClockSec == null ? null : view.streamClockSec + Math.floor((Date.now() - view.streamAt) / 1000),
    unmuted,
  };

  function renderPlayer(t) {
    const vid = t.youtube && t.youtube.videoId;
    if (vid && vid !== shownVideo) {
      shownVideo = vid;
      mountPlayer(t);
    }
    if (!vid && shownVideo !== '') {
      shownVideo = '';
      player = null; ytPlaying = false;
      playerBox.replaceChildren(el('div', { class: 'placeholder' },
        el('div', {}, el('div', { style: 'font-size:18px;font-weight:700', text: t.live ? 'Live now' : 'The broadcast has not started yet' }),
          el('div', { class: 'sub', text: t.facebookUrl ? 'Watch on Facebook below. Scores update here live.' : 'Scores update here live.' }))));
    }
    linksBox.replaceChildren(
      ...[t.youtube && el('a', { class: 'btn', href: t.youtube.watchUrl, target: '_blank', rel: 'noopener', text: 'Watch on YouTube' }),
        t.facebookUrl && el('a', { class: 'btn', href: t.facebookUrl, target: '_blank', rel: 'noopener', text: 'Watch on Facebook' }),
        el('button', { class: 'btn', onclick: () => share(t), text: 'Share' })].filter(Boolean));
  }

  function share(t) {
    const url = location.origin + '/watch/' + t.id;
    if (navigator.share) navigator.share({ title: t.name, url }).catch(() => {});
    else navigator.clipboard && navigator.clipboard.writeText(url);
  }

  function renderBoard(rows) {
    const cats = [...new Set(rows.map((r) => r.category).filter(Boolean))];
    if (category && !cats.includes(category)) category = null;
    const shown = rows.filter((r) => !category || r.category === category);
    const chips = cats.length > 1 ? el('div', { class: 'chips' },
      el('button', { class: 'chip' + (category ? '' : ' on'), text: 'All', onclick: () => { category = null; renderBoard(rows); } }),
      ...cats.map((c) => el('button', { class: 'chip' + (category === c ? ' on' : ''), text: c, onclick: () => { category = c; renderBoard(rows); } }))) : null;
    const body = shown.length
      ? el('div', { class: 'scroll' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', { text: 'Pos' }), el('th', { text: 'Player' }), el('th', { class: 'num', text: 'To par' }), el('th', { class: 'num', text: 'Thru' }))),
          el('tbody', {}, ...shown.map((r) => el('tr', {},
            el('td', { text: r.position || '–' }),
            el('td', {}, el('span', { text: r.name }), r.club ? el('span', { class: 'club', text: r.club }) : null),
            el('td', { class: 'num' + (String(r.toPar).startsWith('-') ? ' under' : ''), text: r.toPar }),
            el('td', { class: 'num', text: r.thru }))))))
      : el('div', { class: 'empty', text: 'Scores appear here as soon as the first hole is played.' });
    boardPanel.replaceChildren(chips, body);
  }

  function renderClips(clips) {
    if (!clips.length) { clipsPanel.hidden = true; return; }
    clipsPanel.hidden = false;
    clipsPanel.replaceChildren(el('h2', {}, el('span', { text: 'Highlights' })),
      el('div', { class: 'clips' }, ...clips.map((c) =>
        el('a', { class: 'clip', href: c.landscapeUrl, target: '_blank', rel: 'noopener' },
          el('img', { src: c.thumbUrl, alt: c.title, loading: 'lazy' }),
          el('span', { text: c.title }),
          el('small', { text: c.durationSec + ' s' })))));
  }


  // ------------------------------------------------------------ chat (watch page + YouTube + Facebook)
  const ICONS = {
    youtube: '<svg viewBox="0 0 24 24"><path d="M9 7l8 5-8 5z"/></svg>',
    facebook: '<svg viewBox="0 0 24 24"><path d="M14 8h2V5h-2.5C10.9 5 10 6.6 10 8.7V10H8v3h2v7h3v-7h2.4l.4-3H13V9c0-.6.3-1 1-1z"/></svg>',
    watch: '<svg viewBox="0 0 24 24"><path d="M7 3v18h2v-7l9-3.5L9 7V3z"/></svg>',
  };
  const SRC_NAME = { youtube: 'YouTube', facebook: 'Facebook', watch: 'CoGolfers' };
  const chatKey = 'cg_chat_' + id;
  let chatAuth = null;
  try { chatAuth = JSON.parse(store.get(chatKey) || 'null'); } catch {}
  const chatState = { version: null, last: 0, msgs: new Map(), pinned: null, enabled: true, slowSec: 3 };
  const chatList = el('div', { class: 'list' });
  const pinBox = el('div');
  const note = el('div', { class: 'note' });
  const composer = el('form', { class: 'composer' });
  const newBtn = el('button', { class: 'new', hidden: true, text: 'New messages ↓', onclick: () => { chatList.scrollTop = chatList.scrollHeight; newBtn.hidden = true; } });
  chatPanel.append(pinBox, chatList, newBtn, composer, note);
  chatList.addEventListener('scroll', () => { if (nearBottom()) newBtn.hidden = true; });
  const nearBottom = () => chatList.scrollHeight - chatList.scrollTop - chatList.clientHeight < 60;

  function msgEl(m) {
    const src = el('span', { class: 'src ' + m.source, title: SRC_NAME[m.source] || '' });
    src.innerHTML = ICONS[m.source] || '';
    return el('div', { class: 'msg' + (m.question ? ' q' : '') + (chatAuth && m.source === 'watch' && m.author === chatAuth.name ? ' mine' : ''), 'data-id': m.id },
      src, el('div', {}, el('span', { class: 'who', text: m.author }), el('span', { class: 'txt', text: m.text })));
  }

  function renderComposer() {
    if (!chatState.enabled) { composer.replaceChildren(el('div', { class: 'sub', style: 'padding:6px 2px', text: 'Chat is off for this broadcast. YouTube and Facebook comments still show here.' })); return; }
    if (!chatAuth) {
      const name = el('input', { placeholder: 'Your name to join the chat', maxlength: '30', autocomplete: 'nickname' });
      composer.onsubmit = async (e) => {
        e.preventDefault();
        note.className = 'note'; note.textContent = '';
        try {
          const r = await fetch(`/api/public/tournaments/${id}/chat/name`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name.value }) });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error && j.error.message);
          chatAuth = { token: j.token, name: j.name }; store.set(chatKey, JSON.stringify(chatAuth)); renderComposer();
          composer.querySelector('input').focus();
        } catch (err) { note.className = 'note err'; note.textContent = err.message || 'Could not join the chat.'; }
      };
      composer.replaceChildren(name, el('button', { type: 'submit', text: 'Join' }));
      return;
    }
    const text = el('input', { placeholder: `Say something, ${chatAuth.name}`, maxlength: '200', autocomplete: 'off' });
    const send = el('button', { type: 'submit', text: 'Send' });
    composer.onsubmit = async (e) => {
      e.preventDefault();
      if (!text.value.trim()) return;
      send.disabled = true; note.className = 'note'; note.textContent = '';
      try {
        const r = await fetch(`/api/public/tournaments/${id}/chat`, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + chatAuth.token }, body: JSON.stringify({ text: text.value }) });
        const j = await r.json();
        if (r.status === 401) { chatAuth = null; store.set(chatKey, 'null'); renderComposer(); return; }
        if (!r.ok) throw new Error(j.error && j.error.message);
        text.value = '';
        addMessages([j.message], true);
      } catch (err) { note.className = 'note err'; note.textContent = err.message || 'Message not sent.'; }
      setTimeout(() => { send.disabled = false; }, chatState.slowSec * 1000);
    };
    composer.replaceChildren(text, send);
    note.className = 'note';
    note.textContent = 'Comments from YouTube and Facebook appear here too. Be kind: messages are moderated.';
  }

  function addMessages(ms, mine) {
    const stick = mine || nearBottom();
    let added = 0;
    for (const m of ms) {
      if (chatState.msgs.has(m.id)) continue;
      chatState.msgs.set(m.id, m);
      chatState.last = Math.max(chatState.last, m.id);
      chatList.append(msgEl(m));
      added++;
    }
    while (chatList.children.length > 300) { const first = chatList.firstChild; chatState.msgs.delete(Number(first.dataset.id)); first.remove(); }
    if (!added) return;
    if (stick) chatList.scrollTop = chatList.scrollHeight; else newBtn.hidden = false;
    if (sideTab !== 'chat' && !mine) { unread += added; drawTabs(); }
  }

  async function pollChat() {
    try {
      const q = `after=${chatState.last}` + (chatState.version != null ? `&v=${chatState.version}` : '');
      const d = await api(`/api/public/tournaments/${id}/chat?${q}`);
      const enabledChanged = d.enabled !== chatState.enabled;
      chatState.enabled = d.enabled; chatState.slowSec = d.slowSec; chatState.version = d.version;
      if (!d.unchanged) {
        const stick = chatState.last === 0 || nearBottom();
        for (const hid of d.hidden || []) { const n = chatList.querySelector(`[data-id="${hid}"]`); if (n) n.remove(); chatState.msgs.delete(hid); }
        addMessages(d.messages || [], false);
        const p = d.pinned;
        pinBox.replaceChildren(...(p ? [el('div', { class: 'pinned' }, el('span', { class: 'k', text: `Pinned · ${SRC_NAME[p.source] || ''}` }), el('strong', { text: p.author + ' ' }), document.createTextNode(p.text))] : []));
        if (stick) { chatList.scrollTop = chatList.scrollHeight; newBtn.hidden = true; }
      }
      if (enabledChanged) renderComposer();
    } catch {}
    setTimeout(pollChat, document.hidden ? 10000 : 3000);
  }

  function drawTabs() {
    sideTabs.replaceChildren(
      el('button', { class: sideTab === 'board' ? 'on' : '', onclick: () => { sideTab = 'board'; drawSide(); }, text: 'Leaderboard' }),
      el('button', { class: sideTab === 'chat' ? 'on' : '', onclick: () => { sideTab = 'chat'; unread = 0; drawSide(); chatList.scrollTop = chatList.scrollHeight; newBtn.hidden = true; } },
        'Live chat', unread ? el('span', { class: 'count', text: unread > 99 ? '99+' : String(unread) }) : null),
    );
  }
  function drawSide() { drawTabs(); sideBody.replaceChildren(sideTab === 'chat' ? chatPanel : boardPanel); }

  async function tournament() {
    try {
      const d = await api('/api/public/tournaments/' + id);
      const t = d.tournament;
      document.title = t.name + ' · Go Live';
      const sig = JSON.stringify([t.name, t.venue, t.live, d.onAir && d.onAir.hole]);
      if (sig !== last) {
        last = sig;
        head.replaceChildren(el('div', { style: 'flex:1;min-width:0' },
          el('div', { class: 'brand', text: t.orgName ? 'Go Live · ' + t.orgName : 'Go Live' }),
          el('h1', { text: t.name }),
          el('div', { class: 'sub', text: [t.venue, d.onAir && d.onAir.hole ? 'On camera: hole ' + d.onAir.hole : null].filter(Boolean).join(' · ') })),
          livePill(t.live));
      }
      renderPlayer(t);
      renderBoard(d.leaderboard);
      renderClips(d.clips);
    } catch (e) {
      if (e === 404) { app.replaceChildren(el('p', { class: 'sub', text: 'This tournament is not available.' })); return; }
    }
    setTimeout(tournament, 10000);
  }

  if (!id) { list(); return; }
  app.replaceChildren(head,
    el('div', { class: 'grid' }, el('div', {}, playerBox, linksBox), sidePanel),
    clipsPanel,
    el('footer', { text: 'Produced with Go Live' }));
  if (new URLSearchParams(location.search).get('tab') === 'chat') sideTab = 'chat';
  drawSide();
  renderComposer();
  tournament();
  pollChat();
})();
</script>
</body>
</html>
