<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Studio · Go Live</title>
<link rel="icon" href="/site/favicon.svg">
<style>
  :root { --bg:#0b0e10; --panel:#15191c; --panel2:#1b2024; --line:#252b30; --ink:#f3f5f4; --muted:#9aa5a0; --live:#e53935; --green:#2e7d4f; --gold:#c9a227; --warn:#f2b33d; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:inherit; }
  header.top { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  .brand { font-weight:800; letter-spacing:.08em; font-size:12px; color:var(--gold); text-transform:uppercase; }
  header.top h1 { font-size:17px; margin:0; }
  .sp { flex:1; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  h2 { font-size:18px; margin:24px 0 10px; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .banner { border-radius:10px; padding:12px 14px; margin:12px 0; font-size:14px; }
  .banner.warn { background:rgba(242,179,61,.12); border:1px solid var(--warn); }
  .banner.ok { background:rgba(46,125,79,.15); border:1px solid var(--green); }
  nav.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:16px 0; overflow-x:auto; }
  nav.tabs button { background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); font:inherit; font-weight:700; padding:10px 14px; cursor:pointer; white-space:nowrap; }
  nav.tabs button.on { color:var(--ink); border-bottom-color:var(--gold); }
  nav.tabs button:disabled { opacity:.4; cursor:default; }
  .btn { display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font:inherit; font-size:14px; cursor:pointer; text-decoration:none; }
  .btn.primary { background:var(--live); border-color:var(--live); color:#fff; font-weight:700; }
  .btn.small { min-height:30px; padding:0 10px; font-size:13px; }
  .btn:disabled { opacity:.5; cursor:default; }
  input, select, textarea { background:#0f1315; border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:9px 11px; font:inherit; font-size:14px; width:100%; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .form { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; align-items:end; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap; }
  td.n, th.n { text-align:right; }
  .pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; font-weight:800; background:#3a4247; }
  .pill.live { background:var(--live); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .stat .v { font-size:24px; font-weight:800; }
  .stat .l { color:var(--muted); font-size:12px; }
  .list a.ev { display:flex; justify-content:space-between; gap:12px; padding:14px; border-bottom:1px solid var(--line); text-decoration:none; }
  dialog { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px; max-width:min(720px,94vw); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .kit { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; }
  .kit canvas { width:180px; height:auto; border-radius:8px; border:1px solid var(--line); background:#000; }
  .kit .sq canvas { width:220px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#222a2f; border:1px solid var(--line); padding:10px 16px; border-radius:8px; z-index:20; }
  .toast.err { border-color:var(--bad); }
  .link { font-family:ui-monospace,monospace; font-size:13px; word-break:break-all; }
</style>
</head>
<body>
<header class="top"><div><div class="brand">Go Live</div><h1>Studio</h1></div><div class="sp"></div><span class="muted small" id="who"></span><button class="btn small" id="out">Log out</button></header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
(() => {
  'use strict';
  const main = document.getElementById('main');
  let token = null;
  try { token = localStorage.getItem('baas.token'); } catch {}
  if (!token) { location.replace('/login?next=' + encodeURIComponent(location.pathname)); return; }
  const eventId = (location.pathname.match(/^\/studio\/([0-9a-f-]{36})/) || [])[1] || null;

  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
    return n;
  };
  const toast = (msg, err) => { const t = el('div', { class: 'toast' + (err ? ' err' : ''), text: msg }); document.body.append(t); setTimeout(() => t.remove(), err ? 6000 : 2500); };
  const logout = () => { try { localStorage.removeItem('baas.token'); localStorage.removeItem('baas.session'); } catch {} location.replace('/login?next=' + encodeURIComponent(location.pathname)); };
  document.getElementById('out').onclick = logout;
  async function call(method, url, body) {
    const r = await fetch(url, { method, headers: { authorization: 'Bearer ' + token, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401) { logout(); throw new Error('Signed out'); }
    const d = r.status === 204 ? null : await r.json().catch(() => null);
    if (!r.ok) throw new Error((d && d.error && d.error.message) || 'Error ' + r.status);
    return d;
  }
  const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { if (e.message !== 'Signed out') toast(e.message, true); } };
  const copy = (text, what) => { navigator.clipboard && navigator.clipboard.writeText(text).then(() => toast((what || 'Link') + ' copied')); };
  const stat = (v, l) => el('div', { class: 'stat' }, el('div', { class: 'v', text: String(v) }), el('div', { class: 'l', text: l }));

  // ------------------------------------------------------------------ event list
  async function events() {
    const [me, list] = await Promise.all([call('GET', '/api/me'), call('GET', '/api/tournaments')]);
    document.getElementById('who').textContent = me.principal.email || '';
    const mine = list.tournaments.filter((t) => !t.archived && (t.role === 'owner' || t.role === 'director'));
    main.replaceChildren(
      el('h2', { style: 'margin-top:0', text: 'Your events' }),
      el('p', { class: 'muted small', text: 'Influencer links, games and prizes, and reports for each event.' }),
      el('div', { class: 'card list', style: 'padding:0' }, mine.length
        ? mine.map((t) => el('a', { class: 'ev', href: '/studio/' + t.id }, el('div', {}, el('strong', { text: t.name }), el('div', { class: 'muted small', text: [t.orgName, t.venue, t.startsOn].filter(Boolean).join(' · ') })), el('span', { class: 'muted', text: '›' })))
        : el('p', { class: 'muted', style: 'padding:16px', text: 'No events yet. Create one in the Go Live app.' })));
  }

  // ------------------------------------------------------------------ one event
  let tab = 'influencers', timer = null, ev = null;
  async function event() {
    const [me, list] = await Promise.all([call('GET', '/api/me'), call('GET', '/api/tournaments')]);
    document.getElementById('who').textContent = me.principal.email || '';
    ev = list.tournaments.find((t) => t.id === eventId);
    if (!ev) { main.replaceChildren(el('p', { class: 'muted', text: 'This event is not in your organisations.' })); return; }
    document.title = ev.name + ' · Studio';
    render();
  }
  function render() {
    clearInterval(timer);
    const body = el('div', {}, el('p', { class: 'muted', text: 'Loading…' }));
    const tabs = [['influencers', 'Influencers'], ['games', 'Games'], ['winners', 'Winners'], ['reports', 'Reports']];
    main.replaceChildren(
      el('div', { class: 'row' }, el('a', { class: 'btn small', href: '/studio', text: '‹ Events' }), el('a', { class: 'btn small', href: '/watch/' + ev.id, target: '_blank', rel: 'noopener', text: 'Open watch page' })),
      el('h2', { text: ev.name }),
      el('nav', { class: 'tabs' }, tabs.map(([k, label]) => el('button', { class: tab === k ? 'on' : '', disabled: !VIEWS[k], onclick: () => { tab = k; render(); }, text: label }))),
      body);
    guard(async () => { body.replaceChildren(await VIEWS[tab](body)); })();
  }

  // ------------------------------------------------------------------ influencers
  async function influencersView() {
    const d = await call('GET', `/api/tournaments/${ev.id}/influencers`);
    const st = await call('GET', `/api/tournaments/${ev.id}/influencers/stats`);
    const byId = new Map(st.influencers.map((s) => [s.id, s]));
    const canManage = ev.role === 'owner' || ev.role === 'director';
    const box = el('div');

    const name = el('input', { placeholder: 'Ravi Kumar', maxlength: '80' });
    const handle = el('input', { placeholder: '@ravi.golf', maxlength: '80' });
    const platform = el('select', {}, ['instagram', 'youtube', 'facebook', 'whatsapp', 'x', 'other'].map((p) => el('option', { value: p, text: p[0].toUpperCase() + p.slice(1) })));
    const terms = el('input', { placeholder: 'e.g. ₹2 per viewer (30 s+), paid within 7 days', maxlength: '500' });
    const pan = el('input', { placeholder: 'ABCDE1234F (for TDS)', maxlength: '10', style: 'text-transform:uppercase' });
    const add = guard(async (e) => {
      e.preventDefault();
      if (!name.value.trim()) return toast('Enter the influencer’s name', true);
      await call('POST', `/api/tournaments/${ev.id}/influencers`, { name: name.value, handle: handle.value || null, platform: platform.value, terms: terms.value || null, pan: pan.value || null });
      toast('Influencer added'); render();
    });

    const t = st.totals;
    box.append(
      d.playable.ok ? null : el('div', { class: 'banner warn' }, el('strong', { text: 'Links work now; the video plays once it is ready. ' }), d.playable.reason, ' Until then the watch page offers “Remind me”.'),
      el('div', { class: 'grid' },
        stat(t.watchingNow, 'Watching on the page now'),
        stat(t.youtubeViewersNow ?? '–', 'Watching on YouTube now'),
        stat(t.viewers, 'Page viewers in total'),
        stat(`${t.viaLinks} (${t.viaLinksShare}%)`, 'Came through influencer links')),
      el('h2', { text: 'Leaderboard' }),
      el('div', { class: 'card scroll', style: 'padding:0' }, st.influencers.length ? el('table', {},
        el('thead', {}, el('tr', {}, ['#', 'Influencer', 'Now ', 'Taps ', 'Viewers 30 s+ ', 'Left <30 s ', 'Minutes ', 'Avg watch ', 'Unmuted ', 'Reminders ', 'Before / first 10 min / later'].map((h) => el('th', { class: h.endsWith(' ') ? 'n' : '', text: h.trim() })))),
        el('tbody', {}, st.influencers.map((s, i) => el('tr', {},
          el('td', { text: String(i + 1) }),
          el('td', {}, el('strong', { text: s.name }), s.handle ? el('div', { class: 'muted small', text: s.handle }) : null),
          el('td', { class: 'n', text: String(s.watchingNow) }), el('td', { class: 'n', text: String(s.clicks) }),
          el('td', { class: 'n', text: String(s.qualifiedViewers) }), el('td', { class: 'n', text: String(s.bouncedViewers) }),
          el('td', { class: 'n', text: String(s.watchMinutes) }), el('td', { class: 'n', text: Math.floor(s.avgWatchSec / 60) + ':' + String(s.avgWatchSec % 60).padStart(2, '0') }),
          el('td', { class: 'n', text: s.unmutedRate + '%' }), el('td', { class: 'n', text: String(s.reminders) }),
          el('td', { class: 'small', text: `${s.arrivedBeforeLive} / ${s.arrivedFirst10Min} / ${s.arrivedLater}` }))))) : el('p', { class: 'muted', style: 'padding:14px', text: 'Add influencers below; their numbers appear here live.' })),
      el('p', { class: 'muted small', text: 'A viewer counts after 30 seconds of real watching. Credit goes to the first influencer link a viewer opened (within ' + d.attributionDays + ' days). Refreshes every 15 seconds.' }));

    if (canManage) {
      box.append(el('h2', { text: 'Add an influencer' }), el('form', { class: 'card form', onsubmit: add },
        el('div', {}, el('label', { text: 'Name' }), name), el('div', {}, el('label', { text: 'Handle' }), handle), el('div', {}, el('label', { text: 'Platform' }), platform),
        el('div', { style: 'grid-column:1/-1' }, el('label', { text: 'Payout terms (optional)' }), terms),
        el('div', {}, el('label', { text: 'PAN (optional)' }), pan),
        el('div', {}, el('button', { class: 'btn primary', type: 'submit', text: 'Add influencer' }))));
    }

    box.append(el('h2', { text: 'Links and promotion kits' }), el('div', { class: 'card scroll', style: 'padding:0' }, d.influencers.length ? el('table', {},
      el('thead', {}, el('tr', {}, ['Influencer', 'Short link', 'Terms', ''].map((h) => el('th', { text: h })))),
      el('tbody', {}, d.influencers.map((i) => el('tr', {},
        el('td', {}, el('strong', { text: i.name }), el('div', { class: 'muted small', text: [i.handle, i.platform, i.panHint ? 'PAN ' + i.panHint : null].filter(Boolean).join(' · ') })),
        el('td', {}, el('div', { class: 'link', text: i.link.replace(/^https?:\/\//, '') })),
        el('td', { class: 'small', text: i.terms || '–' }),
        el('td', {}, el('div', { class: 'row' },
          el('button', { class: 'btn small', onclick: () => copy(i.link), text: 'Copy link' }),
          el('button', { class: 'btn small', onclick: guard(() => openKit(i)), text: 'Promotion kit' }),
          el('button', { class: 'btn small', onclick: () => copy(i.statsUrl, 'Stats link'), text: 'Copy stats link' }),
          canManage ? el('button', { class: 'btn small', onclick: guard(async () => { if (!confirm('Make a new stats link for ' + i.name + '? The old one stops working.')) return; await call('POST', `/api/tournaments/${ev.id}/influencers/${i.id}/rotate-stats`, {}); toast('New stats link made'); render(); }), text: 'New stats link' }) : null,
          canManage ? el('button', { class: 'btn small', onclick: guard(async () => { if (!confirm('Remove ' + i.name + '? Their link stops working; their numbers stay in reports.')) return; await call('PATCH', `/api/tournaments/${ev.id}/influencers/${i.id}`, { archived: true }); render(); }), text: 'Remove' }) : null)))))) : el('p', { class: 'muted', style: 'padding:14px', text: 'No influencers yet.' })));

    if (canManage) {
      const days = el('input', { type: 'number', min: '1', max: '30', value: String(d.attributionDays), style: 'width:90px' });
      const board = el('input', { type: 'checkbox', checked: d.influencerBoard ? true : null, style: 'width:auto' });
      box.append(el('h2', { text: 'Settings' }), el('div', { class: 'card' },
        el('div', { class: 'row' }, el('label', { style: 'margin:0', text: 'Credit window (days)' }), days,
          el('label', { style: 'margin:0 0 0 16px;display:flex;gap:6px;align-items:center' }, board, 'Influencers can see each other’s totals'),
          el('button', { class: 'btn small', onclick: guard(async () => { await call('PATCH', `/api/tournaments/${ev.id}/viewership-settings`, { attributionDays: Number(days.value), influencerBoard: board.checked }); toast('Saved'); }), text: 'Save' }))));
    }
    timer = setInterval(guard(async () => { if (tab === 'influencers' && !document.querySelector('dialog[open]')) { const b = main.lastChild; b.replaceChildren(await influencersView()); } }), 15000);
    return box;
  }

  // ------------------------------------------------------------------ promotion kit (drawn in the browser)
  const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
  function wrap(ctx, text, maxW) {
    const words = text.split(/\s+/); const lines = []; let line = '';
    for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
    if (line) lines.push(line);
    return lines;
  }
  async function draw(k, w, hgt) {
    const c = el('canvas', { width: String(w), height: String(hgt) });
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, w, hgt); g.addColorStop(0, '#123222'); g.addColorStop(1, '#0b0e10');
    x.fillStyle = g; x.fillRect(0, 0, w, hgt);
    const story = hgt > w;
    const pad = 80; let y = story ? 170 : 110;
    x.fillStyle = '#e53935'; x.beginPath(); x.arc(pad + 14, y - 14, 14, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#c9a227'; x.font = '800 34px system-ui, Arial'; x.fillText('GO LIVE', pad + 44, y);
    y += story ? 110 : 80;
    x.fillStyle = '#fff'; x.font = `800 ${story ? 96 : 76}px system-ui, Arial`;
    for (const l of wrap(x, k.eventName, w - pad * 2).slice(0, 3)) { x.fillText(l, pad, y); y += story ? 106 : 84; }
    x.fillStyle = '#cfd6d2'; x.font = `500 ${story ? 44 : 36}px system-ui, Arial`;
    const sub = [k.venue, k.startsOn].filter(Boolean).join(' · ');
    if (sub) { x.fillText(sub, pad, y); y += story ? 70 : 54; }
    x.fillStyle = '#fff'; x.font = `700 ${story ? 50 : 40}px system-ui, Arial`;
    x.fillText(`Watch live with ${k.influencer.handle || k.influencer.name}`, pad, y + (story ? 40 : 20));
    const qrSize = story ? 520 : 360;
    const qx = story ? (w - qrSize) / 2 : w - pad - qrSize, qy = story ? hgt - qrSize - 330 : hgt - qrSize - 130;
    x.fillStyle = '#fff'; x.fillRect(qx - 24, qy - 24, qrSize + 48, qrSize + 48);
    const qr = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(k.qrSvg));
    x.drawImage(qr, qx, qy, qrSize, qrSize);
    x.fillStyle = '#fff'; x.textAlign = story ? 'center' : 'left';
    // The link must fit on one line: shrink the type until it does.
    const room = story ? w - pad * 2 : qx - pad - 40;
    let size = story ? 44 : 34;
    do { x.font = `700 ${size}px system-ui, Arial`; size -= 2; } while (x.measureText(k.shortLink).width > room && size > 18);
    x.fillText(k.shortLink, story ? w / 2 : pad, story ? hgt - 200 : hgt - 70);
    x.fillStyle = '#9aa5a0'; x.font = `500 ${story ? 34 : 28}px system-ui, Arial`;
    x.fillText('Scan or tap the link · free to watch', story ? w / 2 : pad, story ? hgt - 140 : hgt - 30);
    return c;
  }
  async function openKit(i) {
    const k = await call('GET', `/api/tournaments/${ev.id}/influencers/${i.id}/kit`);
    const [story, post] = await Promise.all([draw(k, 1080, 1920), draw(k, 1080, 1080)]);
    const save = (c, file) => c.toBlob((b) => { const a = el('a', { href: URL.createObjectURL(b), download: file }); document.body.append(a); a.click(); a.remove(); }, 'image/png');
    const base = (k.influencer.handle || k.influencer.name).replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
    const dlg = el('dialog', {},
      el('h2', { style: 'margin-top:0', text: 'Promotion kit · ' + i.name }),
      el('p', { class: 'muted small', text: 'Send these to the influencer: a story (with the link sticker set to the short link) and a post. The QR code and link credit their viewers.' }),
      el('div', { class: 'kit' },
        el('div', {}, story, el('div', {}, el('button', { class: 'btn small', onclick: () => save(story, `${base}-story.png`), text: 'Download story' }))),
        el('div', { class: 'sq' }, post, el('div', {}, el('button', { class: 'btn small', onclick: () => save(post, `${base}-post.png`), text: 'Download post' })))),
      el('p', {}, el('span', { class: 'muted small', text: 'Short link: ' }), el('span', { class: 'link', text: k.link })),
      el('div', { class: 'row' },
        el('button', { class: 'btn small', onclick: () => copy(k.link), text: 'Copy link' }),
        el('button', { class: 'btn small', onclick: () => copy(`${k.eventName}: watch live with me! ${k.link}`, 'Message'), text: 'Copy message' }),
        el('button', { class: 'btn small', onclick: () => copy(k.statsUrl, 'Stats link'), text: 'Copy their stats link' }),
        el('span', { class: 'sp' }),
        el('button', { class: 'btn', onclick: () => dlg.close(), text: 'Close' })));
    dlg.addEventListener('close', () => dlg.remove());
    document.body.append(dlg); dlg.showModal();
  }


  // ------------------------------------------------------------------ games (moments)
  const mmss = (sec) => sec == null ? '' : Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  const parseTime = (v) => { v = String(v || '').trim(); if (!v) return null; const p = v.split(':').map(Number); if (p.some(isNaN)) return NaN; return p.length === 1 ? p[0] : p.length === 2 ? p[0] * 60 + p[1] : p[0] * 3600 + p[1] * 60 + p[2]; };
  const TYPES = { quiz: 'Quiz', poll: 'Poll', prediction: 'Prediction', spin: 'Spin the wheel', draw: 'Lucky draw' };
  const PICKS = { '': 'No prize', draw: 'Random draw among players', first_correct: 'First right answers', spin: 'Winning wheel segments' };
  const CLOCKS = { viewer: 'Viewer clock (from each viewer’s start)', stream: 'Stream clock (from Go live)', director: 'Director fires it live' };
  const AUD = { all: 'Everyone', unmuted: 'Unmuted viewers', ref: 'One influencer’s viewers', new: 'New viewers', returning: 'Returning viewers' };

  async function gamesView() {
    const [d, rep, infs] = await Promise.all([
      call('GET', `/api/tournaments/${ev.id}/moments`),
      call('GET', `/api/tournaments/${ev.id}/moments/report`),
      call('GET', `/api/tournaments/${ev.id}/influencers`),
    ]);
    const canManage = ev.role === 'owner' || ev.role === 'director';
    const repById = new Map(rep.moments.map((r) => [r.id, r]));

              canManage ? el('button', { class: 'btn small', onclick: guard(async () => { if (!confirm('Delete “' + m.title + '” and its results?')) return; await call('DELETE', `/api/tournaments/${ev.id}/moments/${m.id}`); render(); }), text: 'Delete' }) : null)));

  }

  function settle(m) {

  function editMoment(m, influencers) {

  // ------------------------------------------------------------------ winners

        el('div', { class: 'row', style: 'margin-top:10px' }, el('label', { style: 'margin:0', text: 'Prizes per viewer per event' }), per,

    }

    return box;

  const VIEWS = { influencers: influencersView, games: gamesView, winners: winnersView };
  guard(eventId ? event : events)();
})();
