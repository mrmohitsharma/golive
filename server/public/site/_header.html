<a class="sr-only" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="{{BRAND}} home">
      <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="14" fill="#ee3b2f"/>
        <circle class="ring" cx="15" cy="15" r="10.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="46 20" stroke-linecap="round"/>
        <path d="M12.6 10.4v9.2l7.4-4.6z" fill="#fff"/>
      </svg>
      {{BRAND}}
    </a>
    <nav class="site-nav" aria-label="Main">
      <a class="hide-sm" href="/#director">Product</a>
      <a class="hide-sm" href="/#cost">Savings</a>
      <a class="hide-sm" href="/#pricing">Pricing</a>
      <a class="hide-sm" href="/#faq">Questions</a>
      <a href="/login" data-auth="out">Log in</a>
      <a href="/account" data-auth="in" hidden>Your account</a>
      <a class="btn btn-live" href="/signup" data-auth="out"><span class="dot" aria-hidden="true"></span>Start free</a>
    </nav>
  </div>
</header>
<script>
  // Swap Log in / Start free for the account link when signed in on this browser.
  (function () {
    var signedIn = false;
    try { signedIn = !!localStorage.getItem('baas.token'); } catch (e) {}
    if (!signedIn) return;
    document.querySelectorAll('[data-auth="out"]').forEach(function (n) { n.hidden = true; });
    document.querySelectorAll('[data-auth="in"]').forEach(function (n) { n.hidden = false; });
  })();
</script>
